<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" role="img" aria-label="Happy Tails">
  <defs>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A9B7E"/>
      <stop offset="100%" stop-color="#5C7A60"/>
    </linearGradient>
  </defs>
  <!-- Soft paw mark -->
  <g fill="url(#leaf)">
    <ellipse cx="28" cy="40" rx="14" ry="16"/>
    <circle cx="14" cy="22" r="5.5"/>
    <circle cx="26" cy="16" r="5.8"/>
    <circle cx="39" cy="18" r="5.5"/>
    <circle cx="46" cy="30" r="5.2"/>
  </g>
  <!-- Wordmark -->
  <text x="62" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="600" fill="#2A2A28" letter-spacing="-0.5">Happy Tails</text>
  <text x="64" y="54" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5C7A60" letter-spacing="2.4">PET SITTING &amp; BOARDING</text>
